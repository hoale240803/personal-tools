<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Best Buy Supplies - Price Scraper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      width: 400px;
      min-height: 500px;
      background: #0f0f13;
      color: #e2e8f0;
      overflow-x: hidden;
    }

    /* ===== HEADER ===== */
    .header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      padding: 20px;
      border-bottom: 1px solid rgba(99, 102, 241, 0.3);
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 60% 40%, rgba(99, 102, 241, 0.1) 0%, transparent 50%);
      pointer-events: none;
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }

    .logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      flex-shrink: 0;
    }

    .header-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
    }

    .header-subtitle {
      font-size: 11px;
      color: rgba(226, 232, 240, 0.5);
      margin-top: 2px;
    }

    .status-badge {
      margin-left: auto;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
    }

    .status-badge.idle {
      background: rgba(100, 116, 139, 0.2);
      color: #94a3b8;
      border: 1px solid rgba(100, 116, 139, 0.3);
    }

    .status-badge.running {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.4);
      animation: pulse-badge 1.5s ease-in-out infinite;
    }

    .status-badge.done {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .status-badge.error {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    @keyframes pulse-badge {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* ===== MAIN CONTENT ===== */
    .content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ===== URL INPUT AREA ===== */
    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: #6366f1;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(99, 102, 241, 0.2);
    }

    textarea#urlInput {
      width: 100%;
      height: 110px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 10px;
      color: #e2e8f0;
      font-family: 'Inter', monospace;
      font-size: 12px;
      line-height: 1.6;
      padding: 10px 12px;
      resize: none;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea#urlInput:focus {
      border-color: rgba(99, 102, 241, 0.5);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    textarea#urlInput::placeholder {
      color: rgba(148, 163, 184, 0.4);
    }

    /* ===== ACTION BUTTONS ===== */
    .btn-group {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      position: relative;
      overflow: hidden;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.05);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
    }

    .btn-primary:hover {
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
    }

    /* ===== PROGRESS BAR ===== */
    .progress-section {
      display: none;
    }

    .progress-section.visible {
      display: block;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .progress-text {
      font-size: 12px;
      color: #94a3b8;
    }

    .progress-count {
      font-size: 12px;
      font-weight: 600;
      color: #6366f1;
    }

    .progress-bar-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      border-radius: 3px;
      transition: width 0.5s ease;
      position: relative;
    }

    .progress-bar-fill::after {
      content: '';
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 20px;
      background: rgba(255,255,255,0.3);
      filter: blur(4px);
      animation: shimmer 1.5s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    /* ===== STATS ROW ===== */
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px 12px;
      text-align: center;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      line-height: 1;
    }

    .stat-value.success { color: #34d399; }
    .stat-value.error { color: #f87171; }
    .stat-value.total { color: #818cf8; }

    .stat-label {
      font-size: 10px;
      color: #64748b;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ===== RESULTS AREA ===== */
    .results-container {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
    }

    .results-header {
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .results-title {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .copy-btn {
      font-size: 10px;
      font-weight: 500;
      color: #6366f1;
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .copy-btn:hover {
      background: rgba(99, 102, 241, 0.15);
    }

    pre#resultOutput {
      max-height: 160px;
      overflow-y: auto;
      padding: 12px;
      font-size: 11px;
      line-height: 1.6;
      font-family: 'Consolas', 'Monaco', monospace;
      color: #94a3b8;
      white-space: pre-wrap;
      word-break: break-word;
    }

    pre#resultOutput::-webkit-scrollbar {
      width: 4px;
    }

    pre#resultOutput::-webkit-scrollbar-track {
      background: transparent;
    }

    pre#resultOutput::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.3);
      border-radius: 2px;
    }

    .placeholder-text {
      color: rgba(100, 116, 139, 0.5);
      font-style: italic;
      font-size: 11px;
    }

    /* ===== FOOTER ===== */
    .footer {
      padding: 12px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-tip {
      font-size: 10px;
      color: rgba(100, 116, 139, 0.6);
    }

    .footer-version {
      font-size: 10px;
      color: rgba(100, 116, 139, 0.4);
    }

    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(16, 185, 129, 0.95);
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 100;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ===== SPINNER ===== */
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .spinner.visible {
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="header-top">
      <div class="logo">🛒</div>
      <div>
        <div class="header-title">Best Buy Supplies</div>
        <div class="header-subtitle">Price Scraper v1.0</div>
      </div>
      <span class="status-badge idle" id="statusBadge">Idle</span>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="content">

    <!-- URL INPUT -->
    <div>
      <div class="section-label">Danh sách URL</div>
      <textarea
        id="urlInput"
        placeholder="Dán URL sản phẩm vào đây, mỗi dòng 1 URL&#10;&#10;Ví dụ:&#10;https://www.amazon.com/dp/B08N5WRWNW&#10;https://www.temu.com/goods.html?goods_id=..."
      ></textarea>
    </div>

    <!-- BUTTONS -->
    <div class="btn-group">
      <button class="btn btn-primary" id="startBtn" onclick="handleStart()">
        <div class="spinner" id="btnSpinner"></div>
        <span id="btnText">🚀 Bắt đầu quét</span>
      </button>
      <button class="btn btn-secondary" id="clearBtn" onclick="handleClear()">
        🗑️ Xóa
      </button>
    </div>

    <!-- PROGRESS -->
    <div class="progress-section" id="progressSection">
      <div class="progress-header">
        <span class="progress-text">Đang quét...</span>
        <span class="progress-count" id="progressCount">0 / 0</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressBar" style="width: 0%"></div>
      </div>
    </div>

    <!-- STATS -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-value total" id="statTotal">0</div>
        <div class="stat-label">Tổng</div>
      </div>
      <div class="stat-card">
        <div class="stat-value success" id="statSuccess">0</div>
        <div class="stat-label">Thành công</div>
      </div>
      <div class="stat-card">
        <div class="stat-value error" id="statError">0</div>
        <div class="stat-label">Lỗi</div>
      </div>
    </div>

    <!-- RESULTS OUTPUT -->
    <div class="results-container">
      <div class="results-header">
        <span class="results-title">Kết quả JSON</span>
        <button class="copy-btn" id="copyBtn" onclick="copyResults()">📋 Copy</button>
      </div>
      <pre id="resultOutput"><span class="placeholder-text">Kết quả sẽ hiển thị ở đây sau khi quét...</span></pre>
    </div>

  </div>

  <!-- FOOTER -->
  <div class="footer">
    <span class="footer-tip">💡 Mỗi tab tự đóng sau khi cào xong</span>
    <span class="footer-version">v1.0.0</span>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div class="toast" id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
