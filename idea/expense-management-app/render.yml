services:
  # ── Single service: Express serves both API and React frontend ─────────────
  # dev-server.ts detects NODE_ENV=production and serves web/dist as static files
  - type: web
    name: expense-api
    env: node
    plan: free
    branch: main
    rootDir: idea/expense-management-app
    buildCommand: npm install && cd web && npm install --include=dev && npm run build && cd .. && cd api && npm install
    startCommand: node --loader=tsx dev-server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://expense-api.onrender.com/api/auth/callback
      - key: SESSION_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
