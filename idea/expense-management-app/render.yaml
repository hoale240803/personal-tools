services:
  # ── API (Express server wrapping Vercel Function handlers) ─────────────────
  - type: web
    name: expense-api
    env: node
    plan: free
    branch: main
    rootDir: .
    buildCommand: npm install && cd api && npm install
    startCommand: node --loader=tsx dev-server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        # Replace with your actual Render API service URL after first deploy
        value: https://expense-api.onrender.com/api/auth/callback
      - key: SESSION_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false

  # ── Web Frontend (React + Vite static site) ────────────────────────────────
  - type: static_site
    name: expense-web
    env: static
    branch: main
    rootDir: .
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: web/dist
    routes:
      # Proxy /api/* calls to the API service
      - path: /api/*
        destination: https://expense-api.onrender.com/api/$1
      # SPA fallback — all other routes serve index.html
      - path: /*
        destination: /index.html
