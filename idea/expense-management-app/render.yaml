# render.yaml — Render Blueprint
# Docs: https://render.com/docs/infrastructure-as-code
#
# How to use:
#   1. Push this file to your GitHub repo (root level)
#   2. Go to Render Dashboard → New → Blueprint
#   3. Connect your GitHub repo → Render auto-detects this file
#   4. Click "Apply" — both services are created automatically
#   5. Set environment variables in Render dashboard (one-time setup)
#
# Auto-deploy: Render watches the connected GitHub branch (main) and
# re-deploys automatically on every push. No GitHub Actions needed.

services:
  # ── API: Express long-running web service ─────────────────────────────────
  - type: web
    name: expense-api
    runtime: node
    region: singapore          # Change to your preferred region
    plan: free                 # or 'starter' for no sleep
    branch: main
    rootDir: .
    buildCommand: npm install && cd api && npm run build
    startCommand: cd api && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Set these via Render Dashboard → Environment:
      - key: GEMINI_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false            # e.g. https://expense-api.onrender.com/api/auth/callback
      - key: SESSION_SECRET
        generateValue: true    # Render auto-generates a secure random string
      - key: APP_ORIGIN
        sync: false            # e.g. https://expense-web.onrender.com
      - key: CRON_SECRET
        generateValue: true
      - key: USER_SESSIONS
        sync: false
      - key: PUBSUB_TOPIC_NAME
        sync: false

  # ── Web: React static site ────────────────────────────────────────────────
  - type: web
    name: expense-web
    runtime: static
    region: singapore
    plan: free
    branch: main
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: web/dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      # SPA fallback — all routes serve index.html
      - type: rewrite
        source: /*
        destination: /index.html
