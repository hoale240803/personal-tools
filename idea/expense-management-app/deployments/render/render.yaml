services:
  # ── API (Express server chạy Node) ─────────────────────────────────────────
  - type: web
    name: expense-api
    env: node
    plan: free
    branch: main
    rootDir: ../../.. # Đi ngược từ deployments/render/ về gốc repo
    buildCommand: npm install && cd idea/expense-management-app/api && npm install
    startCommand: node --loader=tsx idea/expense-management-app/api/dev-server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://expense-api.onrender.com/api/auth/callback
      - key: SESSION_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false

# Tách riêng phần Static Site ra khỏi mục services
statics:
  # ── Web Frontend (React + Vite static site) ────────────────────────────────
  - name: expense-web
    branch: main
    rootDir: ../../.. # Đi ngược từ deployments/render/ về gốc repo
    buildCommand: cd idea/expense-management-app/web && npm install && npm run build
    publishPath: idea/expense-management-app/web/dist # Lưu ý: Đổi tên thành 'publishPath' (bỏ chữ static_)
    routes:
      # Proxy /api/* calls sang API service
      - path: /api/*
        destination: https://expense-api.onrender.com/api/$1
      # SPA fallback — tất cả các route khác đều trả về index.html
      - path: /*
        destination: /index.html